# Workflow reutilizable: lint con ruff y pruebas con pytest para proyectos Python.
name: Reusable · Python

on:
  workflow_call:
    inputs:
      python-version:
        description: Versión de Python
        type: string
        default: "3.12"
      working-directory:
        description: Carpeta del proyecto
        type: string
        default: "."
      requirements-file:
        description: Archivo de dependencias (relativo a working-directory)
        type: string
        default: requirements-dev.txt
      run-lint:
        description: Ejecutar ruff check
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ inputs.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.requirements-file }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r "${{ inputs.requirements-file }}"

      - name: Lint (ruff)
        if: ${{ inputs.run-lint }}
        run: ruff check .

      - name: Pruebas (pytest)
        run: pytest --junitxml=test-results.xml

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results
          path: ${{ inputs.working-directory }}/test-results.xml
          if-no-files-found: ignore
