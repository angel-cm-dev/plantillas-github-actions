# Workflow reutilizable: build multi-plataforma y push de imágenes a GitHub Container Registry.
# El workflow que lo llama debe otorgar: permissions: { contents: read, packages: write }
name: Reusable · Docker → GHCR

on:
  workflow_call:
    inputs:
      image-name:
        description: Nombre de la imagen sin registro (por defecto owner/repo)
        type: string
        default: ""
      context:
        description: Contexto de build
        type: string
        default: "."
      dockerfile:
        description: Ruta del Dockerfile (por defecto <context>/Dockerfile)
        type: string
        default: ""
      platforms:
        description: Plataformas destino separadas por comas
        type: string
        default: linux/amd64
      push:
        description: Publicar la imagen en GHCR
        type: boolean
        default: true
    outputs:
      digest:
        description: Digest de la imagen construida
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: Tags generados
        value: ${{ jobs.build.outputs.tags }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build y push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar QEMU
        if: ${{ contains(inputs.platforms, 'arm') }}
        uses: docker/setup-qemu-action@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login en GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ inputs.image-name || github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build y push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Resumen
        env:
          PUSH: ${{ inputs.push }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Imagen Docker"
            echo "- Push: ${PUSH}"
            echo "- Digest: ${DIGEST}"
            echo "- Tags:"
            echo "${TAGS}" | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
