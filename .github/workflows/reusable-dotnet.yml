# Workflow reutilizable: restore, build y pruebas de soluciones .NET.
name: Reusable · .NET

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: Versión del SDK de .NET (p. ej. 8.0.x)
        type: string
        default: "8.0.x"
      working-directory:
        description: Carpeta que contiene la solución o el proyecto
        type: string
        default: "."
      configuration:
        description: Configuración de compilación
        type: string
        default: Release
      run-format-check:
        description: Ejecutar dotnet format --verify-no-changes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-test:
    name: Build y pruebas (.NET ${{ inputs.dotnet-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Caché de NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Verificar formato
        if: ${{ inputs.run-format-check }}
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration ${{ inputs.configuration }}

      - name: Pruebas
        run: dotnet test --no-build --configuration ${{ inputs.configuration }} --logger trx --results-directory TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: ${{ inputs.working-directory }}/TestResults
          if-no-files-found: ignore
